#
# ./.yamllint.yaml
#
# yamllint https://yamllint.readthedocs.io/ configuration

extends: default

rules:
  braces:
    max-spaces-inside: 1
    max-spaces-inside-empty: 0
    level: error
  brackets:
    max-spaces-inside: 1
    max-spaces-inside-empty: 0
    level: error
  colons:
    max-spaces-after: -1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  line-length: disable
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  quoted-strings:
    required: only-when-needed
    quote-type: any
    check-keys: false
  trailing-spaces: {}
  truthy:
    allowed-values:
      - 'true'
      - 'false'
    check-keys: true
