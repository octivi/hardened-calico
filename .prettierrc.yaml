# ./.prettierrc.yaml
#
# Prettier https://prettier.io/ configuration

printWidth: 80
tabWidth: 2
useTabs: false
overrides:
  - files: '*.json'
    options:
      parser: json
  - files: '*.md'
    options:
      printWidth: 100
      proseWrap: always
  - files:
      - '*.yml'
      - '*.yaml'
    options:
      singleQuote: true
